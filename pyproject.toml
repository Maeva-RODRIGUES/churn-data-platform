[project]
name = "churn-data-platform"
version = "0.1.0"
description = ""
authors = [
    {name = "Maeva RODRIGUES",email = "maeva.rodrigues@lapiscine.pro"}
]
requires-python = ">=3.12,<3.15"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
pandas = "^2.2"
sqlalchemy = "^2.0.51"
psycopg2-binary = "^2.9.12"
beautifulsoup4 = "^4.15.0"
requests = "^2.34.2"
sdv = "^1.37.3"
dbt-postgres = "^1.10.2"
scikit-learn = "^1.9.0"
xgboost = "^3.3.0"
mlflow = "^3.14.0"
fastapi = "^0.139.0"
uvicorn = "^0.49.0"
streamlit = "^1.58.0"
python-dotenv = "^1.2.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "nbstripout (>=0.9.1,<0.10.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-include = ["*.ipynb"]
# Modules in scripts/ are first-party (imported by tests through pytest pythonpath).
src = [".", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP"]
# Line length is enforced by `ruff format`; long string literals are left alone.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# In notebooks a bare last-line expression is how a cell displays a value, and
# exploratory cells may catch broadly to keep the notebook running.
"*.ipynb" = ["B018", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ is not a package: expose it so tests can import the scripts directly.
pythonpath = ["scripts"]
